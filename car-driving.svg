<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">小车在公路上行驶</title>
  <desc id="d">阳光明媚的郊外公路上，一辆红色小车向前行驶：车轮飞转、路边树木与路牌掠过、云朵缓缓飘动、风车旋转。</desc>

  <defs>
    <!-- 天空 -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc0ee"/>
      <stop offset=".55" stop-color="#abddf6"/>
      <stop offset="1" stop-color="#fdeecb"/>
    </linearGradient>
    <!-- 车灯光束 -->
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffefb3" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffefb3" stop-opacity="0"/>
    </linearGradient>

    <!-- 云朵 -->
    <g id="cloud">
      <ellipse cx="2" cy="10" rx="48" ry="11" fill="#dcedf8"/>
      <ellipse cx="-34" cy="4" rx="30" ry="14" fill="#ffffff"/>
      <ellipse cx="36" cy="3" rx="34" ry="15" fill="#ffffff"/>
      <ellipse cx="0" cy="-5" rx="40" ry="17" fill="#ffffff"/>
    </g>

    <!-- 圆冠树 / 松树 / 灌木 / 小花 / 指示牌 -->
    <g id="treeRound">
      <rect x="-5" y="-42" width="10" height="42" fill="#8a5a3b"/>
      <circle cx="-16" cy="-42" r="16" fill="#46a856"/>
      <circle cx="16" cy="-42" r="16" fill="#379248"/>
      <circle cx="0" cy="-54" r="24" fill="#3f9d4e"/>
    </g>
    <g id="treePine">
      <rect x="-4" y="-26" width="8" height="26" fill="#8a5a3b"/>
      <polygon points="0,-56 -30,-14 30,-14" fill="#287a41"/>
      <polygon points="0,-74 -26,-32 26,-32" fill="#2c8344"/>
      <polygon points="0,-92 -22,-52 22,-52" fill="#2f8f46"/>
    </g>
    <g id="bush">
      <ellipse cx="-16" cy="-7" rx="16" ry="10" fill="#4da04c"/>
      <ellipse cx="6" cy="-10" rx="24" ry="13" fill="#57ab54"/>
    </g>
    <g id="flower">
      <line x1="0" y1="0" x2="0" y2="-12" stroke="#3e8a3e" stroke-width="2"/>
      <circle cy="-15" r="4" fill="#ff8fab"/>
      <circle cy="-15" r="1.6" fill="#ffe08a"/>
    </g>
    <g id="sign">
      <rect x="-3" y="-52" width="6" height="52" fill="#8b93a5"/>
      <circle cy="-66" r="15" fill="#2f6fd0" stroke="#ffffff" stroke-width="3"/>
      <path d="M-7 -66 H4 M4 -66 l-5 -5 M4 -66 l-5 5" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- 风车（叶片旋转） -->
    <g id="windmill">
      <polygon points="-7,0 7,0 3,-62 -3,-62" fill="#f6f3ea"/>
      <rect x="-10" y="-3" width="20" height="4" fill="#d8d3c3"/>
      <g transform="translate(0,-64)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/>
          <rect x="-2.5" y="-30" width="5" height="30" rx="2.5" fill="#fbfaf4"/>
          <rect x="-2.5" y="-30" width="5" height="30" rx="2.5" fill="#fbfaf4" transform="rotate(120)"/>
          <rect x="-2.5" y="-30" width="5" height="30" rx="2.5" fill="#fbfaf4" transform="rotate(240)"/>
        </g>
        <circle r="4.5" fill="#e5533d"/>
      </g>
    </g>

    <!-- 近景路旁（一个 960 宽的循环段） -->
    <g id="nearStrip">
      <use href="#treeRound" transform="translate(80,428)"/>
      <use href="#flower" transform="translate(150,428)"/>
      <use href="#bush" transform="translate(232,428)"/>
      <use href="#treePine" transform="translate(342,428) scale(1.05)"/>
      <use href="#flower" transform="translate(432,428)"/>
      <use href="#treeRound" transform="translate(560,428) scale(.92)"/>
      <use href="#bush" transform="translate(652,428)"/>
      <use href="#sign" transform="translate(726,428)"/>
      <use href="#treePine" transform="translate(832,428)"/>
      <use href="#flower" transform="translate(902,428)"/>
    </g>

    <!-- 中景（慢速视差：小树、风车） -->
    <g id="midStrip">
      <use href="#treeRound" transform="translate(120,414) scale(.5)"/>
      <use href="#bush" transform="translate(252,414) scale(.6)"/>
      <use href="#windmill" transform="translate(430,414) scale(.9)"/>
      <use href="#treePine" transform="translate(592,414) scale(.55)"/>
      <use href="#bush" transform="translate(702,414) scale(.5)"/>
      <use href="#treeRound" transform="translate(804,414) scale(.45)"/>
      <use href="#bush" transform="translate(912,414) scale(.55)"/>
    </g>
  </defs>

  <!-- ===== 天空与太阳 ===== -->
  <rect width="960" height="540" fill="url(#sky)"/>
  <g transform="translate(140,108)">
    <circle r="58" fill="#ffe9a8" opacity=".4">
      <animate attributeName="opacity" values=".3;.5;.3" dur="5s" repeatCount="indefinite"/>
    </circle>
    <g stroke="#ffcf5c" stroke-width="5" stroke-linecap="round">
      <line x1="0" y1="-62" x2="0" y2="-78"/>
      <line x1="0" y1="-62" x2="0" y2="-78" transform="rotate(45)"/>
      <line x1="0" y1="-62" x2="0" y2="-78" transform="rotate(90)"/>
      <line x1="0" y1="-62" x2="0" y2="-78" transform="rotate(135)"/>
      <line x1="0" y1="-62" x2="0" y2="-78" transform="rotate(180)"/>
      <line x1="0" y1="-62" x2="0" y2="-78" transform="rotate(225)"/>
      <line x1="0" y1="-62" x2="0" y2="-78" transform="rotate(270)"/>
      <line x1="0" y1="-62" x2="0" y2="-78" transform="rotate(315)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </g>
    <circle r="42" fill="#ffd166"/>
    <circle r="42" fill="none" stroke="#f4b942" stroke-width="3" opacity=".6"/>
  </g>

  <!-- ===== 飘动的云（多层不同速度） ===== -->
  <g opacity=".95">
    <animateTransform attributeName="transform" type="translate" from="1100 76" to="-300 76" dur="58s" begin="-35s" repeatCount="indefinite"/>
    <use href="#cloud"/>
  </g>
  <g opacity=".9">
    <animateTransform attributeName="transform" type="translate" from="1100 132" to="-300 132" dur="74s" begin="-12s" repeatCount="indefinite"/>
    <use href="#cloud" transform="scale(.7)"/>
  </g>
  <g opacity=".97">
    <animateTransform attributeName="transform" type="translate" from="1100 50" to="-300 50" dur="66s" begin="-50s" repeatCount="indefinite"/>
    <use href="#cloud" transform="scale(1.3)"/>
  </g>
  <g opacity=".85">
    <animateTransform attributeName="transform" type="translate" from="1100 170" to="-300 170" dur="48s" begin="-27s" repeatCount="indefinite"/>
    <use href="#cloud" transform="scale(.55)"/>
  </g>

  <!-- ===== 飞鸟 ===== -->
  <g stroke="#3a506b" stroke-width="3" fill="none" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="translate" from="1000 150" to="-120 112" dur="30s" begin="-6s" repeatCount="indefinite"/>
      <path d="M0 0 Q6 -8 12 0 Q18 -8 24 0">
        <animate attributeName="d" dur=".7s" repeatCount="indefinite"
          values="M0 0 Q6 -8 12 0 Q18 -8 24 0;M0 0 Q6 6 12 0 Q18 6 24 0;M0 0 Q6 -8 12 0 Q18 -8 24 0"/>
      </path>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="1000 186" to="-120 150" dur="36s" begin="-22s" repeatCount="indefinite"/>
      <g transform="scale(.7)">
        <path d="M0 0 Q6 -8 12 0 Q18 -8 24 0">
          <animate attributeName="d" dur=".6s" repeatCount="indefinite"
            values="M0 0 Q6 -8 12 0 Q18 -8 24 0;M0 0 Q6 6 12 0 Q18 6 24 0;M0 0 Q6 -8 12 0 Q18 -8 24 0"/>
        </path>
      </g>
    </g>
  </g>

  <!-- ===== 远山（两层 + 雪顶） ===== -->
  <path d="M0 352 L110 236 L200 300 L300 210 L392 296 L470 250 L560 322 L648 238 L742 312 L836 262 L960 330 L960 352 Z" fill="#a9cdd8"/>
  <path d="M285 224 L300 210 L316 224 L308 219 L300 226 L292 219 Z" fill="#eef8fb"/>
  <path d="M634 251 L648 238 L662 251 L655 247 L648 253 L641 247 Z" fill="#eef8fb"/>
  <path d="M0 386 L84 300 L170 352 L268 280 L356 342 L470 292 L580 352 L688 300 L788 356 L878 318 L960 360 L960 386 Z" fill="#7fb9a4"/>

  <!-- ===== 山丘草地 ===== -->
  <path d="M0 428 Q120 366 300 392 Q470 416 600 386 Q760 356 960 400 L960 428 Z" fill="#85c96c"/>

  <!-- 中景循环层（慢速） -->
  <g>
    <use href="#midStrip"/>
    <use href="#midStrip" x="960"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="13s" repeatCount="indefinite"/>
  </g>

  <!-- 路缘草带 -->
  <rect y="412" width="960" height="16" fill="#6fb355"/>

  <!-- ===== 公路 ===== -->
  <rect y="428" width="960" height="112" fill="#474c5e"/>
  <rect y="428" width="960" height="5" fill="#5d6378"/>
  <rect y="534" width="960" height="6" fill="#363a49"/>
  <rect y="440" width="960" height="4" fill="#f5f7fa" opacity=".85"/>
  <!-- 中央黄色虚线：快速滚动 -->
  <line x1="0" y1="505" x2="960" y2="505" stroke="#ffd75e" stroke-width="9" stroke-dasharray="64 46">
    <animate attributeName="stroke-dashoffset" from="0" to="110" dur=".55s" repeatCount="indefinite"/>
  </line>

  <!-- ===== 车后气流速度线 ===== -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="330" y1="424" x2="410" y2="424">
      <animate attributeName="x1" values="330;140" dur=".5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="410;220" dur=".5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.75;0" dur=".5s" repeatCount="indefinite"/>
    </line>
    <line x1="320" y1="446" x2="392" y2="446">
      <animate attributeName="x1" values="320;130" dur=".5s" begin="-.17s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="392;200" dur=".5s" begin="-.17s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.7;0" dur=".5s" begin="-.17s" repeatCount="indefinite"/>
    </line>
    <line x1="330" y1="468" x2="414" y2="468">
      <animate attributeName="x1" values="330;150" dur=".5s" begin="-.34s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="414;234" dur=".5s" begin="-.34s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.75;0" dur=".5s" begin="-.34s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===== 近景路旁循环层（快速掠过，车从前面经过） ===== -->
  <g>
    <use href="#nearStrip"/>
    <use href="#nearStrip" x="960"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-960 0" dur="4.8s" repeatCount="indefinite"/>
  </g>

  <!-- ===== 汽车 ===== -->
  <!-- 地面阴影（随颠簸微微伸缩） -->
  <ellipse cx="478" cy="481" rx="155" ry="8" fill="#1c2136" opacity=".3">
    <animate attributeName="rx" values="155;150;155" dur=".5s" repeatCount="indefinite"/>
  </ellipse>

  <!-- 排气管与尾气 -->
  <rect x="320" y="447" width="14" height="7" rx="3" fill="#9aa3b5"/>
  <g fill="#cfd8e3">
    <circle cx="316" cy="450" r="3" opacity="0">
      <animate attributeName="cx" values="316;278" dur=".9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="450;438" dur=".9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;11" dur=".9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.55;0" dur=".9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="316" cy="450" r="3" opacity="0">
      <animate attributeName="cx" values="316;278" dur=".9s" begin="-.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="450;440" dur=".9s" begin="-.3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;11" dur=".9s" begin="-.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.55;0" dur=".9s" begin="-.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="316" cy="450" r="3" opacity="0">
      <animate attributeName="cx" values="316;278" dur=".9s" begin="-.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="450;436" dur=".9s" begin="-.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;11" dur=".9s" begin="-.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;.55;0" dur=".9s" begin="-.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 车身（含车厢，整体轻微颠簸） -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur=".5s" repeatCount="indefinite"/>
    <!-- 车灯光束 -->
    <polygon points="618,420 736,400 736,456 618,436" fill="url(#beam)">
      <animate attributeName="opacity" values=".5;.9;.5" dur="2.4s" repeatCount="indefinite"/>
    </polygon>
    <!-- 车厢 -->
    <path d="M406 414 L426 368 Q430 360 440 360 L514 360 Q524 360 529 368 L550 414 Z" fill="#ef5350" stroke="#c62f2f" stroke-width="2"/>
    <!-- 车窗 -->
    <path d="M433 370 L422 406 L472 406 L472 370 Z" fill="#d3ecfb"/>
    <path d="M484 370 L484 406 L538 406 L524 370 Z" fill="#d3ecfb"/>
    <path d="M515 374 L524 402" stroke="#ffffff" stroke-width="3" opacity=".6" stroke-linecap="round"/>
    <!-- 车身主体 -->
    <rect x="330" y="410" width="290" height="46" rx="20" fill="#ef5350"/>
    <rect x="340" y="444" width="270" height="10" rx="5" fill="#cf3b38"/>
    <path d="M432 364 Q477 356 522 364" stroke="#ffffff" stroke-width="3" opacity=".4" fill="none" stroke-linecap="round"/>
    <!-- 车门缝与门把手 -->
    <path d="M478 412 V452" stroke="#c62f2f" stroke-width="2" opacity=".8"/>
    <rect x="488" y="420" width="16" height="5" rx="2.5" fill="#c62f2f"/>
    <!-- 车头灯 / 尾灯 -->
    <circle cx="612" cy="428" r="7" fill="#ffe9a0" stroke="#f2b93f" stroke-width="2"/>
    <rect x="329" y="420" width="9" height="13" rx="3" fill="#ff7043"/>
  </g>

  <!-- 车轮（贴地不颠簸，轮毂飞转） -->
  <g transform="translate(398,450)">
    <circle r="28" fill="#262b3f"/>
    <circle r="15" fill="#eef2f6"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".6s" repeatCount="indefinite"/>
      <circle r="24" fill="none" stroke="#141827" stroke-width="3" stroke-dasharray="5 7"/>
      <g stroke="#9aa3b5" stroke-width="4" stroke-linecap="round">
        <line y1="-11" y2="11"/><line x1="-11" x2="11"/>
        <line x1="-7.8" y1="-7.8" x2="7.8" y2="7.8"/>
        <line x1="-7.8" y1="7.8" x2="7.8" y2="-7.8"/>
      </g>
    </g>
    <circle r="4.5" fill="#59627a"/>
  </g>
  <g transform="translate(560,450)">
    <circle r="28" fill="#262b3f"/>
    <circle r="15" fill="#eef2f6"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".6s" repeatCount="indefinite"/>
      <circle r="24" fill="none" stroke="#141827" stroke-width="3" stroke-dasharray="5 7"/>
      <g stroke="#9aa3b5" stroke-width="4" stroke-linecap="round">
        <line y1="-11" y2="11"/><line x1="-11" x2="11"/>
        <line x1="-7.8" y1="-7.8" x2="7.8" y2="7.8"/>
        <line x1="-7.8" y1="7.8" x2="7.8" y2="-7.8"/>
      </g>
    </g>
    <circle r="4.5" fill="#59627a"/>
  </g>
</svg>
